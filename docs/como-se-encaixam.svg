<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 390" width="680" height="390" role="img" aria-labelledby="t d">
<title id="t">Como as skills do cass se encaixam</title>
<desc id="d">Uma linha de montagem em três postos: pensar (planejar, spec-plan, auto-think), construir (implementar ou gpt-builder) e conferir (build-review), com volta ao construtor quando reprova. Embaixo, quatro skills avulsas que servem a qualquer momento: ask-me, search, gpt-optimizer e handoff.</desc>
<style>
svg{--tx:#1f2328;--mu:#59636e;--ln:#59636e;--hf:#e1f5ee;--hs:#0f6e56;--ht:#085041;--hu:#0f6e56;--nf:#f6f8fa;--ns:#d1d9e0;--pf:#eaeef2}
@media (prefers-color-scheme:dark){svg{--tx:#e6edf3;--mu:#9198a1;--ln:#9198a1;--hf:#0b3a30;--hs:#5dcaa5;--ht:#e1f5ee;--hu:#9fe1cb;--nf:#151b23;--ns:#3d444d;--pf:#262c36}}
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;font-size:12px;fill:var(--mu)}
.h{font-size:14px;font-weight:600;fill:var(--tx)}
.hot rect{fill:var(--hf);stroke:var(--hs);stroke-width:1}
.hot .h{fill:var(--ht)}.hot .s{fill:var(--hu)}
.nb rect{fill:var(--nf);stroke:var(--ns);stroke-width:1}
.ln{stroke:var(--ln);stroke-width:1.2;fill:none}
.dash{stroke-dasharray:4 3}
.frame{fill:none;stroke:var(--ns);stroke-width:1;stroke-dasharray:4 3}
.ah{fill:none;stroke:var(--ln);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.pill{fill:var(--pf);stroke:var(--ns)}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M2 1L8 5L2 9"/></marker></defs>
<text x="130" y="44" text-anchor="middle">pensar</text>
<text x="350" y="44" text-anchor="middle">construir (um ou outro)</text>
<text x="560" y="44" text-anchor="middle">conferir</text>
<g class="hot"><rect x="40" y="60" width="180" height="52" rx="4"/><text class="h" x="130" y="82" text-anchor="middle">planejar</text><text class="s" x="130" y="100" text-anchor="middle">produto novo</text></g>
<g class="hot"><rect x="40" y="130" width="180" height="52" rx="4"/><text class="h" x="130" y="152" text-anchor="middle">spec-plan</text><text class="s" x="130" y="170" text-anchor="middle">mudança ou ideia</text></g>
<g class="hot"><rect x="40" y="210" width="180" height="52" rx="4"/><text class="h" x="130" y="232" text-anchor="middle">auto-think</text><text class="s" x="130" y="250" text-anchor="middle">problema aberto</text></g>
<line class="ln" x1="130" y1="210" x2="130" y2="184" marker-end="url(#a)"/>
<text x="140" y="201">opção escolhida</text>
<rect class="frame" x="270" y="60" width="160" height="202" rx="4"/>
<g class="hot"><rect x="286" y="84" width="128" height="52" rx="4"/><text class="h" x="350" y="106" text-anchor="middle">implementar</text><text class="s" x="350" y="124" text-anchor="middle">o Claude constrói</text></g>
<text x="350" y="166" text-anchor="middle">ou</text>
<g class="hot"><rect x="286" y="184" width="128" height="52" rx="4"/><text class="h" x="350" y="206" text-anchor="middle">gpt-builder</text><text class="s" x="350" y="224" text-anchor="middle">o GPT constrói</text></g>
<line class="ln" x1="220" y1="86" x2="268" y2="86" marker-end="url(#a)"/>
<line class="ln" x1="220" y1="156" x2="268" y2="156" marker-end="url(#a)"/>
<text x="245" y="78" text-anchor="middle">plano</text>
<text x="245" y="148" text-anchor="middle">tarefas</text>
<rect class="pill" x="480" y="60" width="160" height="40" rx="20"/><text class="h" x="560" y="85" text-anchor="middle">pode publicar</text>
<g class="hot"><rect x="480" y="130" width="160" height="52" rx="4"/><text class="h" x="560" y="152" text-anchor="middle">build-review</text><text class="s" x="560" y="170" text-anchor="middle">3 revisores</text></g>
<line class="ln" x1="432" y1="156" x2="478" y2="156" marker-end="url(#a)"/>
<line class="ln" x1="560" y1="130" x2="560" y2="102" marker-end="url(#a)"/>
<text x="570" y="120">aprovou</text>
<path class="ln dash" d="M560 182 V222 H434" marker-end="url(#a)"/>
<text x="500" y="240" text-anchor="middle">reprovou: volta</text>
<line x1="40" y1="284" x2="640" y2="284" stroke="var(--ns)" stroke-width="1" stroke-dasharray="2 3"/>
<text x="40" y="304">a qualquer momento, fora da linha</text>
<g class="nb"><rect x="40" y="316" width="138" height="52" rx="4"/><text class="h" x="109" y="338" text-anchor="middle">ask-me</text><text x="109" y="356" text-anchor="middle">entrevista antes</text></g>
<g class="nb"><rect x="194" y="316" width="138" height="52" rx="4"/><text class="h" x="263" y="338" text-anchor="middle">search</text><text x="263" y="356" text-anchor="middle">pesquisa com fonte</text></g>
<g class="nb"><rect x="348" y="316" width="138" height="52" rx="4"/><text class="h" x="417" y="338" text-anchor="middle">gpt-optimizer</text><text x="417" y="356" text-anchor="middle">testa uma decisão</text></g>
<g class="nb"><rect x="502" y="316" width="138" height="52" rx="4"/><text class="h" x="571" y="338" text-anchor="middle">handoff</text><text x="571" y="356" text-anchor="middle">troca de sessão</text></g>
</svg>
