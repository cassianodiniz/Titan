<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 604" width="680" height="604" role="img" aria-labelledby="t d">
<title id="t">Qual skill do cass usar, pela sua situação</title>
<desc id="d">Mapa de porta de entrada. Coisa nova: ask-me e search; se for um produto inteiro, planejar. Mudar um projeto que já funciona: ask-me pra tarefa pequena, ou spec-plan se tem várias etapas. Já sei mais ou menos: ask-me, search atacando o plano, gpt-optimizer. Não sei o que fazer: ask-me, auto-think, spec-plan. Com o plano pronto, implementar ou gpt-implementar constroem e build-review confere; se reprovar, volta pro construtor. A qualquer momento, handoff passa o trabalho pra outra conversa.</desc>
<style>
svg{--tx:#1f2328;--mu:#59636e;--ln:#59636e;--hf:#e1f5ee;--hs:#0f6e56;--ht:#085041;--hu:#0f6e56;--nf:#f6f8fa;--ns:#d1d9e0;--pf:#eaeef2}
@media (prefers-color-scheme:dark){svg{--tx:#e6edf3;--mu:#9198a1;--ln:#9198a1;--hf:#0b3a30;--hs:#5dcaa5;--ht:#e1f5ee;--hu:#9fe1cb;--nf:#151b23;--ns:#3d444d;--pf:#262c36}}
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;font-size:12px;fill:var(--mu)}
.h{font-size:14px;font-weight:600;fill:var(--tx)}
.hot rect{fill:var(--hf);stroke:var(--hs);stroke-width:1}
.hot .h{fill:var(--ht)}.hot .s{fill:var(--hu)}
.nb rect{fill:var(--nf);stroke:var(--ns);stroke-width:1}
.ln{stroke:var(--ln);stroke-width:1.2;fill:none}
.dash{stroke-dasharray:4 3}
.frame{fill:none;stroke:var(--ns);stroke-width:1;stroke-dasharray:4 3}
.ah{fill:none;stroke:var(--ln);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.pill{fill:var(--pf);stroke:var(--ns)}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M2 1L8 5L2 9"/></marker></defs>
<rect class="pill" x="215" y="16" width="250" height="40" rx="20"/><text class="h" x="340" y="41" text-anchor="middle">Qual é a sua situação?</text>
<path class="ln" d="M340 56 V72 H92 V88 M257 72 V88 M423 72 V88 M588 72 V88 M340 72 H588"/>
<g class="nb"><rect x="14.0" y="90" width="156" height="48" rx="4"/><text class="h" x="92" y="110" text-anchor="middle">Coisa nova</text><text class="s" x="92" y="127" text-anchor="middle">ainda não existe</text></g>
<g class="nb"><rect x="179.0" y="90" width="156" height="48" rx="4"/><text class="h" x="257" y="110" text-anchor="middle">Mudar um projeto</text><text class="s" x="257" y="127" text-anchor="middle">que já funciona</text></g>
<g class="nb"><rect x="345.0" y="90" width="156" height="48" rx="4"/><text class="h" x="423" y="110" text-anchor="middle">Já sei mais ou menos</text><text class="s" x="423" y="127" text-anchor="middle">quero testar a ideia</text></g>
<g class="nb"><rect x="510.0" y="90" width="156" height="48" rx="4"/><text class="h" x="588" y="110" text-anchor="middle">Não sei o que fazer</text><text class="s" x="588" y="127" text-anchor="middle">problema em aberto</text></g>
<line class="ln" x1="92" y1="138" x2="92" y2="148" marker-end="url(#a)"/>
<g class="hot"><rect x="17.0" y="150" width="150" height="34" rx="4"/><text class="h" x="92" y="172" text-anchor="middle">ask-me</text></g>
<line class="ln" x1="92" y1="184" x2="92" y2="200" marker-end="url(#a)"/>
<g class="hot"><rect x="17.0" y="202" width="150" height="48" rx="4"/><text class="h" x="92" y="222" text-anchor="middle">search</text><text class="s" x="92" y="239" text-anchor="middle">acha referências</text></g>
<text x="92" y="268" text-anchor="middle">se for um produto inteiro:</text>
<g class="hot"><rect x="17.0" y="276" width="150" height="48" rx="4"/><text class="h" x="92" y="296" text-anchor="middle">planejar</text><text class="s" x="92" y="313" text-anchor="middle">pesquisa + telas + plano</text></g>
<line class="ln" x1="257" y1="138" x2="257" y2="148" marker-end="url(#a)"/>
<g class="hot"><rect x="182.0" y="150" width="150" height="48" rx="4"/><text class="h" x="257" y="170" text-anchor="middle">ask-me</text><text class="s" x="257" y="187" text-anchor="middle">tarefa pequena</text></g>
<text x="257" y="214" text-anchor="middle">ou, se tem várias etapas</text>
<g class="hot"><rect x="182.0" y="224" width="150" height="48" rx="4"/><text class="h" x="257" y="244" text-anchor="middle">spec-plan</text><text class="s" x="257" y="261" text-anchor="middle">plano em tarefas</text></g>
<line class="ln" x1="423" y1="138" x2="423" y2="148" marker-end="url(#a)"/>
<g class="hot"><rect x="348.0" y="150" width="150" height="34" rx="4"/><text class="h" x="423" y="172" text-anchor="middle">ask-me</text></g>
<line class="ln" x1="423" y1="184" x2="423" y2="200" marker-end="url(#a)"/>
<g class="hot"><rect x="348.0" y="202" width="150" height="48" rx="4"/><text class="h" x="423" y="222" text-anchor="middle">search</text><text class="s" x="423" y="239" text-anchor="middle">“ataca o plano”</text></g>
<line class="ln" x1="423" y1="250" x2="423" y2="266" marker-end="url(#a)"/>
<g class="hot"><rect x="348.0" y="268" width="150" height="48" rx="4"/><text class="h" x="423" y="288" text-anchor="middle">gpt-optimizer</text><text class="s" x="423" y="305" text-anchor="middle">GPT tenta derrubar</text></g>
<line class="ln" x1="588" y1="138" x2="588" y2="148" marker-end="url(#a)"/>
<g class="hot"><rect x="513.0" y="150" width="150" height="34" rx="4"/><text class="h" x="588" y="172" text-anchor="middle">ask-me</text></g>
<line class="ln" x1="588" y1="184" x2="588" y2="200" marker-end="url(#a)"/>
<g class="hot"><rect x="513.0" y="202" width="150" height="48" rx="4"/><text class="h" x="588" y="222" text-anchor="middle">auto-think</text><text class="s" x="588" y="239" text-anchor="middle">estuda e dá veredito</text></g>
<line class="ln" x1="588" y1="250" x2="588" y2="266" marker-end="url(#a)"/>
<g class="hot"><rect x="513.0" y="268" width="150" height="48" rx="4"/><text class="h" x="588" y="288" text-anchor="middle">spec-plan</text><text class="s" x="588" y="305" text-anchor="middle">plano em tarefas</text></g>
<path class="ln" d="M92 324 V346 H588 M257 272 V346 M423 316 V346 M588 316 V346 M340 346 V366" marker-end="url(#a)"/>
<text x="350" y="340" text-anchor="start">plano pronto</text>
<rect class="frame" x="150" y="368" width="380" height="64" rx="4"/>
<g class="hot"><rect x="175.0" y="376" width="150" height="48" rx="4"/><text class="h" x="250" y="396" text-anchor="middle">implementar</text><text class="s" x="250" y="413" text-anchor="middle">o Claude constrói</text></g>
<text x="340" y="405" text-anchor="middle">ou</text>
<g class="hot"><rect x="355.0" y="376" width="150" height="48" rx="4"/><text class="h" x="430" y="396" text-anchor="middle">gpt-implementar</text><text class="s" x="430" y="413" text-anchor="middle">o GPT constrói</text></g>
<line class="ln" x1="340" y1="432" x2="340" y2="452" marker-end="url(#a)"/>
<g class="hot"><rect x="250.0" y="454" width="180" height="48" rx="4"/><text class="h" x="340" y="474" text-anchor="middle">build-review</text><text class="s" x="340" y="491" text-anchor="middle">3 revisores conferem</text></g>
<path class="ln dash" d="M430 478 H560 V400 H532" marker-end="url(#a)"/>
<text x="566" y="474" text-anchor="start">reprovou: volta</text>
<line class="ln" x1="340" y1="502" x2="340" y2="520" marker-end="url(#a)"/>
<rect class="pill" x="270" y="522" width="140" height="34" rx="17"/><text class="h" x="340" y="544" text-anchor="middle">pode publicar</text>
<line x1="20" y1="568" x2="660" y2="568" stroke="var(--ns)" stroke-width="1" stroke-dasharray="2 3"/>
<text x="20" y="588" text-anchor="start">A qualquer momento: <tspan class="h" style="font-size:12px">handoff</tspan> salva o ponto e passa o trabalho pra uma conversa nova.</text>
</svg>
